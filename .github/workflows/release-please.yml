name: Release Please

# Manual only: a maintainer decides when to propose a release. Merging the
# release PR it opens is what starts the Release workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamn-release-please-main
  cancel-in-progress: false

jobs:
  release-pr:
    name: Update release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The automatic per-run token replaces a stored credential that expires.
    # Release Please writes the PR, its labels and its branch; `actions: read`
    # is for reporting whether that PR's run awaits approval.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted main configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Wait for the current version to be published
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        # rust-toolchain.toml selects the pinned toolchain through rustup.
        run: cargo run --locked -p hamn-dev -- release pr-ready
      - name: Create or update the release PR
        if: steps.publication.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # Runs after Release Please fails too, to report either why no release PR
      # exists or that an existing one is waiting for a maintainer's approval.
      - name: Report what the release PR still needs
        if: ${{ !cancelled() && steps.publication.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p hamn-dev -- release report-pr
