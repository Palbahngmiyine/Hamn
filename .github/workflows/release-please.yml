name: Release Please

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hamn-release-please-main
  cancel-in-progress: false

jobs:
  release-pr:
    # Skip release PR updates for an explicitly marked push, without skipping CI.
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]'))
    name: Update release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted main configuration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Wait for the current version to be published
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        # rust-toolchain.toml selects the pinned toolchain through rustup.
        run: cargo run --locked -p hamn-dev -- release pr-ready
      - name: Require dedicated Release Please token
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        # A present but expired token reaches release-please as an unattributed
        # "Bad credentials"; name the secret that has to be rotated instead.
        run: gh api rate_limit >/dev/null || { echo '::error::RELEASE_PLEASE_TOKEN is missing or expired; rotate the repository secret.'; exit 1; }
      - name: Create or update the release PR
        if: steps.publication.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
