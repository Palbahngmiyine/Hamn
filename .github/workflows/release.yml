name: Release

on:
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamn-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve push or recovery request
        id: release
        shell: bash
        env:
          PREVIOUS_REF: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            bash packaging/release/resolve-release-version.sh "$PREVIOUS_REF"
          else
            bash packaging/release/resolve-release-request.sh
          fi

  guest-image:
    if: needs.prepare.outputs.should_release == 'true'
    name: Build completed guest image
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install immutable image builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq libguestfs-tools linux-image-virtual
          sudo chmod a+r /boot/vmlinuz-*
          LIBGUESTFS_BACKEND=direct libguestfs-test-tool
      - name: Build completed Ubuntu arm64 guest image
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hamn-guest-inputs"
          mkdir "$work"
          inputs=guest/image/release-inputs.json
          base_url=$(jq -er '.ubuntu.url' "$inputs")
          base_hash=$(jq -er '.ubuntu.sha256' "$inputs")
          k3s_version=$(jq -er '.k3s.version' "$inputs")
          binary_url=$(jq -er '.k3s.binaryUrl' "$inputs")
          binary_hash=$(jq -er '.k3s.binarySha256' "$inputs")
          airgap_url=$(jq -er '.k3s.airgapUrl' "$inputs")
          airgap_hash=$(jq -er '.k3s.airgapSha256' "$inputs")
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-delay 1 -o "$work/base.img" "$base_url"
          printf '%s  %s\n' "$base_hash" "$work/base.img" | sha256sum -c -
          python3 - "$work/k3s-compatibility.json" "$k3s_version" \
            "$binary_url" "$binary_hash" "$airgap_url" "$airgap_hash" <<'PY'
          import json
          import sys

          path, version, binary_url, binary_hash, airgap_url, airgap_hash = sys.argv[1:]
          value = {
              "schemaVersion": 1,
              "version": version,
              "architecture": "arm64",
              "binary": {"url": binary_url, "sha256": binary_hash},
              "airgapImages": {"url": airgap_url, "sha256": airgap_hash},
          }
          with open(path, "w", encoding="utf-8", newline="\n") as output:
              json.dump(value, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY
          ssh-keygen -q -t ed25519 -N '' -f "$work/k3s-compatibility-key"
          ssh-keygen -Y sign -f "$work/k3s-compatibility-key" \
            -n hamn-k3s-compatibility "$work/k3s-compatibility.json" >/dev/null
          LIBGUESTFS_BACKEND=direct \
          HAMN_GUEST_BASE_IMAGE="$work/base.img" \
          HAMN_GUEST_BASE_SHA256="$base_hash" \
          HAMN_GUEST_OUTPUT="$RUNNER_TEMP/hamn-guest.img" \
          HAMN_K3S_COMPATIBILITY_MANIFEST="$work/k3s-compatibility.json" \
          HAMN_K3S_COMPATIBILITY_SIGNATURE="$work/k3s-compatibility.json.sig" \
          HAMN_RELEASE_PUBLIC_KEY="$work/k3s-compatibility-key.pub" \
            bash guest/image/build-ubuntu-24.04-arm64.sh
          rm -f "$work/k3s-compatibility-key" "$work/k3s-compatibility-key.pub"
      - name: Attest completed guest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/hamn-guest.img
      - name: Upload completed guest image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamn-guest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hamn-guest.img
            ${{ runner.temp }}/hamn-guest.img.sha256
          if-no-files-found: error
          retention-days: 14

  candidate:
    if: needs.prepare.outputs.should_release == 'true'
    name: Build and validate exact candidate
    needs: [prepare, guest-image]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert hosted Apple Silicon arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ]
          [ "$RUNNER_OS" = macOS ]
          [ "$RUNNER_ARCH" = ARM64 ]
          [ "$(uname -m)" = arm64 ]
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download completed guest image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-guest-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-guest
      - name: Verify keyless guest-image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/hamn-guest/hamn-guest.img" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Test source, build candidate, and record hosted validation
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/hamn-guest" && shasum -a 256 -c hamn-guest.img.sha256)
          system_sdk=$(env -u SDKROOT -u DEVELOPER_DIR \
            /usr/bin/xcrun --sdk macosx --show-sdk-path)
          HAMN_SYSTEM_SDKROOT="$system_sdk" \
          nix develop .#ci --command bash -euo pipefail <<'NIX_SHELL'
          source scripts/ci/use-system-macos-sdk.sh
          make -j1 SDKROOT="$HAMN_SYSTEM_SDKROOT" test-local-macos
          make release-candidate \
            RELEASE_REF="$GITHUB_SHA" \
            RELEASE_TAG="$RELEASE_TAG" \
            OUTPUT_DIR="$RUNNER_TEMP/hamn-candidate" \
            HAMN_GUEST_IMAGE="$RUNNER_TEMP/hamn-guest/hamn-guest.img"
          make release-hosted-validation \
            RELEASE_REF="$GITHUB_SHA" \
            RELEASE_TAG="$RELEASE_TAG" \
            CANDIDATE_DIR="$RUNNER_TEMP/hamn-candidate" \
            OUTPUT_DIR="$RUNNER_TEMP/hamn-evidence"
          NIX_SHELL
      - name: Attest exact candidate artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/hamn-candidate/SHA256SUMS
      - name: Attest hosted validation evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/hamn-evidence/hosted-validation-evidence.json
      - name: Upload exact candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamn-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-candidate
          if-no-files-found: error
          retention-days: 14
      - name: Upload hosted validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamn-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-evidence
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.prepare.outputs.should_release == 'true'
    name: Publish immutable keyless release
    needs: [prepare, candidate]
    runs-on: macos-15
    environment: hamn-promotion
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-release-input/hamn-candidate
      - name: Download hosted validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-release-input/hamn-evidence
      - name: Verify keyless build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/hamn-release-input/hamn-candidate"
          while read -r digest name; do
            [ -n "$digest" ] && [ -n "$name" ]
            gh attestation verify "$candidate/$name" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < "$candidate/SHA256SUMS"
          gh attestation verify \
            "$RUNNER_TEMP/hamn-release-input/hamn-evidence/hosted-validation-evidence.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Verify hosted evidence and generate immutable manifest
        shell: bash
        env:
          HAMN_RELEASE_REPOSITORY: ${{ github.repository }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hamn-publish"
          HAMN_EXPECTED_WORKFLOW_RUN="$GITHUB_RUN_ID" \
          HAMN_EXPECTED_WORKFLOW_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          bash packaging/release/publish-release.sh \
            "$STABLE_TAG" "$CANDIDATE_TAG" "$GITHUB_SHA" \
            "$RUNNER_TEMP/hamn-release-input" "$RUNNER_TEMP/hamn-publish"
      - name: Attest immutable update manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/hamn-publish/hamn-update-manifest.json
      - name: Create and verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            echo "stable release already exists" >&2
            exit 2
          fi
          candidate="$RUNNER_TEMP/hamn-release-input/hamn-candidate"
          publish="$RUNNER_TEMP/hamn-publish"
          gh release create "$STABLE_TAG" \
            "$candidate/hamn-${STABLE_TAG}-darwin-arm64.tar.gz" \
            "$candidate/hamn-${STABLE_TAG}-ubuntu-24.04-arm64.img" \
            "$candidate/hamn-${STABLE_TAG}.spdx.json" \
            "$candidate/install.sh" \
            "$publish/hamn-update-manifest.json" \
            "$publish/hosted-validation-evidence.json" \
            "$publish/candidate.json" \
            "$publish/SHA256SUMS" \
            "$publish/promoted-from-rc" \
            --draft --target "$GITHUB_SHA" --title "Hamn $STABLE_TAG" \
            --generate-notes \
            --notes "Built, tested, and attested on GitHub-hosted runners. Live Hamn VM E2E was not run."
          gh release view "$STABLE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/hamn-draft-release.json"
          python3 - "$RUNNER_TEMP/hamn-draft-release.json" "$STABLE_TAG" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          path, tag, commit = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              release = json.load(source)
          expected = {
              "hamn-" + tag + "-darwin-arm64.tar.gz",
              "hamn-" + tag + "-ubuntu-24.04-arm64.img",
              "hamn-" + tag + ".spdx.json",
              "install.sh", "hamn-update-manifest.json",
              "hosted-validation-evidence.json", "candidate.json",
              "SHA256SUMS", "promoted-from-rc",
          }
          names = {asset.get("name") for asset in release.get("assets", [])}
          if release.get("tagName") != tag or release.get("targetCommitish") != commit or \
                  release.get("isDraft") is not True or \
                  release.get("isPrerelease") is not False or names != expected:
              raise SystemExit("draft release does not bind every keyless artifact")
          PY
      - name: Publish immutable release and verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
        run: |
          set -euo pipefail
          gh release edit "$STABLE_TAG" --draft=false --latest
          gh release view "$STABLE_TAG" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable \
            --jq 'select(.tagName == env.STABLE_TAG and .targetCommitish == env.GITHUB_SHA and .isDraft == false and .isPrerelease == false and .isImmutable == true) | .tagName' \
            | grep -Fxq "$STABLE_TAG"
          download="$RUNNER_TEMP/hamn-release-download"
          mkdir "$download"
          gh release download "$STABLE_TAG" --dir "$download"
          for file in "$download"/*; do
            gh release verify-asset "$STABLE_TAG" "$file"
          done
          gh release verify "$STABLE_TAG"
