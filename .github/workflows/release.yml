name: Release

on:
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'

permissions:
  contents: read

concurrency:
  group: hamn-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release Please version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version manifest transition
        id: release
        shell: bash
        env:
          PREVIOUS_REF: ${{ github.event.before }}
        run: bash packaging/release/resolve-release-version.sh "$PREVIOUS_REF"
      - name: Require GitHub Verified release commit
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            --jq '.commit.verification.verified')
          [ "$verified" = true ] || {
            echo "release commit must be GitHub Verified" >&2
            exit 2
          }

  candidate:
    if: needs.prepare.outputs.should_release == 'true'
    name: Build exact release candidate
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert hosted Apple Silicon arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || {
            echo "release candidate must run on a GitHub-hosted runner" >&2
            exit 2
          }
          [ "$RUNNER_OS" = macOS ] || {
            echo "release candidate must run on macOS" >&2
            exit 2
          }
          [ "$RUNNER_ARCH" = ARM64 ] || {
            echo "release candidate must run on ARM64" >&2
            exit 2
          }
          [ "$(uname -m)" = arm64 ] || {
            echo "release candidate must run on Apple Silicon arm64" >&2
            exit 2
          }
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test source and build candidate
        shell: bash
        env:
          HAMN_GUEST_IMAGE_URL: ${{ vars.HAMN_GUEST_IMAGE_URL }}
          HAMN_GUEST_IMAGE_SHA256: ${{ vars.HAMN_GUEST_IMAGE_SHA256 }}
          HAMN_RELEASE_PUBLIC_KEY_TEXT: ${{ vars.HAMN_RELEASE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          nix develop .#ci --command bash -euo pipefail <<'NIX_SHELL'
          make -j1 test-local-macos
          test -n "$HAMN_GUEST_IMAGE_URL"
          test "$HAMN_GUEST_IMAGE_SHA256" != ""
          test "$HAMN_GUEST_IMAGE_SHA256" = "$(printf '%s' "$HAMN_GUEST_IMAGE_SHA256" | tr -d '\n' | grep -E '^[0-9a-f]{64}$')"
          case "$HAMN_GUEST_IMAGE_URL" in https://*) ;; *) exit 2 ;; esac
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 1 \
            -o "$RUNNER_TEMP/hamn-guest.img" "$HAMN_GUEST_IMAGE_URL"
          test "$HAMN_GUEST_IMAGE_SHA256" = "$(shasum -a 256 "$RUNNER_TEMP/hamn-guest.img" | awk '{print $1}')"
          umask 077
          printf '%s\n' "$HAMN_RELEASE_PUBLIC_KEY_TEXT" > "$RUNNER_TEMP/hamn-release.pub"
          make release-candidate \
            RELEASE_REF="$GITHUB_SHA" \
            RELEASE_TAG="$RELEASE_TAG" \
            OUTPUT_DIR="$RUNNER_TEMP/hamn-candidate" \
            HAMN_GUEST_IMAGE="$RUNNER_TEMP/hamn-guest.img" \
            HAMN_RELEASE_PUBLIC_KEY="$RUNNER_TEMP/hamn-release.pub"
          NIX_SHELL
      - name: Attest exact candidate artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/hamn-candidate/SHA256SUMS
      - name: Upload exact candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamn-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-candidate
          if-no-files-found: error
          retention-days: 14

  validate:
    if: needs.prepare.outputs.should_release == 'true'
    name: Validate exact candidate on physical Apple Silicon
    needs: [prepare, candidate]
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - hamn-validator
    environment: hamn-validation
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-candidate
      - name: Run physical VM, Docker, K3s, and Colima coexistence gate
        shell: bash
        env:
          HAMN_VALIDATOR_SIGNING_KEY_TEXT: ${{ secrets.HAMN_VALIDATOR_SIGNING_KEY }}
          HAMN_VALIDATOR_IDENTITY: ${{ vars.HAMN_VALIDATOR_IDENTITY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          nix develop .#release --command bash -euo pipefail <<'NIX_SHELL'
          validator_key=
          cleanup_validator_key() {
            local status=$?
            trap - EXIT HUP INT TERM
            if [ -n "${validator_key:-}" ] && { [ -e "$validator_key" ] || [ -L "$validator_key" ]; }; then
              rm -f -- "$validator_key" || {
                echo "cannot remove validator signing key from runner temporary storage" >&2
                [ "$status" -ne 0 ] || status=1
              }
            fi
            unset HAMN_VALIDATOR_SIGNING_KEY_TEXT HAMN_VALIDATOR_SIGNING_KEY
            exit "$status"
          }
          trap cleanup_validator_key EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          test -n "$HAMN_VALIDATOR_SIGNING_KEY_TEXT"
          umask 077
          validator_key="$RUNNER_TEMP/hamn-validator-signing-key"
          printf '%s\n' "$HAMN_VALIDATOR_SIGNING_KEY_TEXT" > "$validator_key"
          chmod 0600 "$validator_key"
          unset HAMN_VALIDATOR_SIGNING_KEY_TEXT
          HAMN_VALIDATOR_PATH="$PATH" \
          HAMN_VALIDATOR_SIGNING_KEY="$validator_key" make release-gate \
            RELEASE_REF="$GITHUB_SHA" \
            RELEASE_TAG="$RELEASE_TAG" \
            CANDIDATE_DIR="$RUNNER_TEMP/hamn-candidate" \
            OUTPUT_DIR="$RUNNER_TEMP/hamn-evidence"
          NIX_SHELL
      - name: Upload signed validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamn-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-evidence
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.prepare.outputs.should_release == 'true'
    name: Publish validated release automatically
    needs: [prepare, candidate, validate]
    runs-on: macos-14
    environment: hamn-promotion
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-release-input/hamn-candidate
      - name: Download signed validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hamn-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/hamn-release-input/hamn-evidence
      - name: Verify evidence and generate canonical manifest
        shell: bash
        env:
          HAMN_VALIDATOR_PUBLIC_KEY_TEXT: ${{ vars.HAMN_VALIDATOR_PUBLIC_KEY }}
          HAMN_RELEASE_SIGNING_KEY_TEXT: ${{ secrets.HAMN_RELEASE_SIGNING_KEY }}
          HAMN_RELEASE_REPOSITORY: ${{ github.repository }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          nix develop .#ci --command bash -euo pipefail <<'NIX_SHELL'
          mkdir "$RUNNER_TEMP/hamn-publish"
          validator_public_key=
          release_key=
          cleanup_publish_keys() {
            local status=$?
            trap - EXIT HUP INT TERM
            if ! rm -f -- "$validator_public_key" "$release_key"; then
              echo "cannot remove release signing material from runner temporary storage" >&2
              [ "$status" -ne 0 ] || status=1
            fi
            unset HAMN_VALIDATOR_PUBLIC_KEY_TEXT HAMN_RELEASE_SIGNING_KEY_TEXT \
                HAMN_VALIDATOR_PUBLIC_KEY HAMN_RELEASE_SIGNING_KEY
            exit "$status"
          }
          trap cleanup_publish_keys EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          umask 077
          validator_public_key="$RUNNER_TEMP/hamn-validator.pub"
          release_key="$RUNNER_TEMP/hamn-release"
          printf '%s\n' "$HAMN_VALIDATOR_PUBLIC_KEY_TEXT" > "$validator_public_key"
          printf '%s\n' "$HAMN_RELEASE_SIGNING_KEY_TEXT" > "$release_key"
          chmod 0600 "$validator_public_key" "$release_key"
          unset HAMN_VALIDATOR_PUBLIC_KEY_TEXT HAMN_RELEASE_SIGNING_KEY_TEXT
          HAMN_VALIDATOR_PUBLIC_KEY="$validator_public_key" \
          HAMN_RELEASE_SIGNING_KEY="$release_key" \
          HAMN_EXPECTED_WORKFLOW_RUN="$GITHUB_RUN_ID" \
          HAMN_EXPECTED_WORKFLOW_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          bash packaging/release/publish-release.sh \
            "$STABLE_TAG" "$CANDIDATE_TAG" "$GITHUB_SHA" \
            "$RUNNER_TEMP/hamn-release-input" "$RUNNER_TEMP/hamn-publish"
          NIX_SHELL
      - name: Create and verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            echo "stable release already exists" >&2
            exit 2
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$STABLE_TAG" >/dev/null; then
            echo "stable tag already exists without this release" >&2
            exit 2
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
          gh release create "$STABLE_TAG" \
            "$RUNNER_TEMP/hamn-release-input/hamn-candidate/hamn-${STABLE_TAG}-darwin-arm64.tar.gz" \
            "$RUNNER_TEMP/hamn-release-input/hamn-candidate/hamn-${STABLE_TAG}-ubuntu-24.04-arm64.img" \
            "$RUNNER_TEMP/hamn-release-input/hamn-candidate/hamn-${STABLE_TAG}.spdx.json" \
            "$RUNNER_TEMP/hamn-release-input/hamn-candidate/install.sh" \
            "$RUNNER_TEMP/hamn-publish/hamn-update-manifest.json" \
            "$RUNNER_TEMP/hamn-publish/hamn-update-manifest.json.sig" \
            "$RUNNER_TEMP/hamn-publish/validation-evidence.json" \
            "$RUNNER_TEMP/hamn-publish/validation-evidence.json.sig" \
            "$RUNNER_TEMP/hamn-publish/e2e.json" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Hamn $STABLE_TAG" \
            --generate-notes \
            --notes "Created automatically after Release Please versioning and exact-byte physical validation."
          gh release view "$STABLE_TAG" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/hamn-draft-release.json"
          python3 - "$RUNNER_TEMP/hamn-draft-release.json" "$STABLE_TAG" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          path, tag, commit = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              release = json.load(source)
          expected = {
              "hamn-" + tag + "-darwin-arm64.tar.gz",
              "hamn-" + tag + "-ubuntu-24.04-arm64.img",
              "hamn-" + tag + ".spdx.json",
              "install.sh",
              "hamn-update-manifest.json",
              "hamn-update-manifest.json.sig",
              "validation-evidence.json",
              "validation-evidence.json.sig",
              "e2e.json",
          }
          assets = release.get("assets")
          names = {asset.get("name") for asset in assets if isinstance(asset, dict)} \
              if isinstance(assets, list) else set()
          if release.get("tagName") != tag or release.get("targetCommitish") != commit or \
                  release.get("isDraft") is not True or \
                  release.get("isPrerelease") is not False or names != expected:
              raise SystemExit("draft release does not bind every validated artifact")
          PY
      - name: Publish immutable release and verify tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
        run: |
          set -euo pipefail
          gh release edit "$STABLE_TAG" --draft=false --latest
          stable_probe="refs/hamn-release/stable-$GITHUB_RUN_ID"
          git fetch --no-tags origin "+refs/tags/${STABLE_TAG}:${stable_probe}"
          stable_commit=$(git rev-parse --verify "${stable_probe}^{commit}")
          [ "$stable_commit" = "$GITHUB_SHA" ] || {
            echo "automatic stable tag does not resolve to the validated commit" >&2
            exit 2
          }
          gh release view "$STABLE_TAG" --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == env.STABLE_TAG and .isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -Fxq "$STABLE_TAG"
