[package]
name = "hamn-dev"
version = "0.0.0"
edition = "2024"
publish = false
description = "Hamn's build, test and release tooling; never shipped in an artifact."

[[bin]]
name = "hamn-dev"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Diagnostic leak patterns are extended regular expressions.
regex = "1"
# The product's rustls features, so both builds share one artifact.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workflow YAML syntax checks; the product already locks this parser.
serde_yaml = "0.9"
sha2 = "0.10"
unicode-width = "0.2"
