[package]
name = "hamn-dev"
version = "0.0.0"
edition = "2024"
publish = false
description = "Hamn's build, test and release tooling; never shipped in an artifact."

[[bin]]
name = "hamn-dev"
path = "src/main.rs"

[dependencies]
# Candidate host archives are gzip tarballs; the physical harness validates
# every member before extracting (the product already locks both crates).
flate2 = "1"
libc = "0.2"
# The product's rustls features, so both builds share one artifact.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
unicode-width = "0.2"
