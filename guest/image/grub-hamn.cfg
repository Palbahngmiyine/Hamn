# The Hamn guest's kernel command line, installed as
# /etc/default/grub.d/90-hamn.cfg: update-grub sources it as shell after the
# cloud image's own settings, so this appends to them.
#
# fsck.repair=yes: at boot, systemd-fsck answers yes to every question of
# fsck instead of preening. Preen stops at "UNEXPECTED INCONSISTENCY; RUN
# fsck MANUALLY" and the guest then runs on its damaged root filesystem,
# which no Hamn operation can check. A repair can delete damaged files or
# move them to /lost+found; for a disposable development VM, a guest that
# boots with a consistent filesystem is preferred.
#
# console=hvc0: the Virtualization.framework serial port, a virtio console,
# which the host keeps as logs/serial.log. The last console= becomes
# /dev/console, where boot and fsck messages are written.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT console=hvc0 fsck.repair=yes"
