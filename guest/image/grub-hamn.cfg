# The Hamn guest's kernel command line, installed as
# /etc/default/grub.d/90-hamn.cfg: update-grub sources it as shell after the
# cloud image's own settings, so this appends to them.
#
# fsck.repair=yes: at boot, systemd-fsck answers yes to every question of
# fsck instead of preening. Preen stops at "UNEXPECTED INCONSISTENCY; RUN
# fsck MANUALLY" and the guest then runs on its damaged root filesystem,
# which no Hamn operation can check. A repair can delete damaged files or
# move them to /lost+found; for a disposable development VM, a guest that
# boots with a consistent filesystem is preferred.
#
# console=hvc0: the Virtualization.framework serial port, a virtio console,
# which the host keeps as logs/serial.log. The last console= becomes
# /dev/console, where boot and fsck messages are written.
#
# oops=panic: a kernel oops panics instead of killing the faulting task and
# running on. An oops in a Hamn guest has meant damaged kernel memory, and a
# kernel that runs on with it can wedge every vCPU or write the damage to
# disk. (panic_on_oops=1 is only the sysctl; as a boot parameter the kernel
# ignores it.)
#
# panic=0: a panicked kernel waits instead of rebooting. Virtualization.framework
# restarts a guest that reboots inside the same VM, which Hamn does not see:
# the profile stays "running" with its SSH master and Docker socket gone. The
# host's vmrun instead stops the VM when the panic banner reaches hvc0, so
# the panic ends in a stopped profile with the panic kept in serial.log.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT console=hvc0 fsck.repair=yes oops=panic panic=0"
