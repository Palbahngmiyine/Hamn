[package]
name = "hamn"
version = "0.0.1"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "hamn"
path = "control/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
base64 = "0.22"
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
ratatui = "0.30.2"
# The poll backend retains simultaneous resize/input readiness. The default
# Mio backend can consume a kqueue batch but return only its first event.
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
bollard = "0.21.1"
kube = { version = "4.2.0", features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
serde_yaml = "0.9"
vt100 = "0.16.2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# PR CI builds and tests the same source faster (CARGO_PROFILE=ci); release
# candidates and published artifacts always use the release profile above.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
